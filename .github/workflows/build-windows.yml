name: build-windows-exe

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install build deps
        run: python -m pip install -r requirements-dev.txt
        
      - name: Test
        run: python -m pytest -q
        
      - name: Build backend
        run: >
          pyinstaller --noconfirm --clean --onefile --console
          --name codeagent-backend --paths src
          --add-data "src\codeagent\samples;codeagent\samples"
          launcher.py
          
      - name: Smoke-test the backend
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\codeagent-backend.exe -ArgumentList 'preprocess','--input','src\codeagent\samples\Architecture_Documentation.md','src\codeagent\samples\Architecture_View.md','--out','spec.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          $spec = Get-Content spec.json -Raw | ConvertFrom-Json
          if ($spec.meta.diagram_count -ne 13) { exit 1 }
          $reply = '{"id": 1, "method": "list_samples", "params": {}}' | dist\codeagent-backend.exe bridge
          $msg = $reply | Select-Object -First 1 | ConvertFrom-Json
          if ($msg.id -ne 1 -or $msg.result.Count -ne 2) { Write-Error "bridge did not answer: $reply"; exit 1 }

      - name: Build Electron app
        shell: pwsh
        run: |
          cd desktop
          npm ci
          npm test
          npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: CodeAgent-windows
          path: desktop/release/CodeAgent.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "CodeAgent ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }} (Windows Desktop)"
          body: |
            ## 🤖 CodeAgent - Standalone Windows Desktop Release
            
            Download **`CodeAgent.exe`** below and double-click to launch. Zero installation required (no Python or Node.js needed).
            
            ### ✨ Highlights
            - **DeepSeek V4 Pro Engine**: Autonomous multi-turn architecture-to-code agent loop.
            - **PlantUML & Architecture Preprocessor**: Deep diagram AST extraction and spec inconsistency checks.
            - **Spec Coverage Gate**: Validates all methods, state transitions, scenarios, and tests before finishing.
            - **Claude Code-Style UI**: Modern dark terminal transcript, real-time todo planning, and token telemetry.
          files: desktop/release/CodeAgent.exe
